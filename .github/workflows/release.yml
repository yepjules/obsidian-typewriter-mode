# From https://marcus.se.net/obsidian-plugin-docs/publishing/release-your-plugin-with-github-actions

name: Release Obsidian plugin
permissions:
  contents: write

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: obsidian-typewriter-mode

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: extractions/setup-just@v2

      - name: Install grass from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: grass

      - name: Build
        id: build
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bun install
          just ci
          mkdir "${PLUGIN_NAME}"
          cp -r dist/* "${PLUGIN_NAME}"
          zip -r "${PLUGIN_NAME}-${TAG_NAME}.zip" "${PLUGIN_NAME}"
          ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          body_path: ./dist/release-notes.md
          files: |
            ./${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
            ./dist/main.js
            ./dist/manifest.json
            ./dist/styles.css

